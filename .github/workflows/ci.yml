name: CI

on:
  push:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".agents/**"
      - ".github/instructions/**"
      - ".github/prompts/**"
      - ".github/agents/**"
      - "skills-lock.json"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".agents/**"
      - ".github/instructions/**"
      - ".github/prompts/**"
      - ".github/agents/**"
      - "skills-lock.json"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      - name: Start minimal local Supabase
        id: supabase
        run: >-
          supabase start
          -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
          > /dev/null
        background: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 12.14.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: pnpm build

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SUPABASE_REALTIME_ENABLED: "false"
      SUPABASE_STORAGE_ENABLED: "false"
      SUPABASE_LOCAL_SMTP_ENABLED: "false"
      SUPABASE_AUTH_EXTERNAL_GOOGLE_ENABLED: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 12.14.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Wait for minimal local Supabase
        wait: supabase

      - name: Run integration tests
        run: pnpm test:integration

  vercel-build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      deployment-url: ${{ steps.build.outputs.deployment-url }}
    permissions:
      contents: read
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 12.14.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Build on Vercel without promoting
        id: build
        run: |
          deployment_url=$(pnpm dlx vercel@latest deploy --prod --skip-domain --yes --token="$VERCEL_TOKEN")
          echo "deployment-url=$deployment_url" >> "$GITHUB_OUTPUT"

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, integration, vercel-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      DEPLOYMENT_URL: ${{ needs.vercel-build.outputs.deployment-url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Promote verified deployment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$main_sha" != "$GITHUB_SHA" ]]; then
            echo "Skipping promotion: main has a newer commit."
            exit 0
          fi
          deployment_host="${DEPLOYMENT_URL#https://}"
          if [[ ! "$deployment_host" =~ ^[a-zA-Z0-9-]+\.vercel\.app$ ]]; then
            echo "Invalid Vercel deployment URL."
            exit 1
          fi
          deployment=$(curl --fail-with-body --silent --show-error --max-time 60 \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/$deployment_host?teamId=$VERCEL_ORG_ID")
          deployment_id=$(jq --exit-status --raw-output --arg project "$VERCEL_PROJECT_ID" \
            'select(.projectId == $project and .target == "production" and .readyState == "READY") | .id | select(type == "string" and startswith("dpl_"))' \
            <<< "$deployment")
          curl --fail-with-body --silent --show-error --max-time 60 \
            --request POST \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{}' \
            "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/promote/$deployment_id?teamId=$VERCEL_ORG_ID"
          echo "Promotion requested for $deployment_id."
