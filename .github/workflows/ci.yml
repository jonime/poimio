name: CI

on:
  push:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".agents/**"
      - ".github/instructions/**"
      - ".github/prompts/**"
      - ".github/agents/**"
      - "skills-lock.json"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 12.14.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: pnpm build

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SUPABASE_REALTIME_ENABLED: "false"
      SUPABASE_STORAGE_ENABLED: "false"
      SUPABASE_LOCAL_SMTP_ENABLED: "false"
      SUPABASE_AUTH_EXTERNAL_GOOGLE_ENABLED: "false"
      SUPABASE_USE_SLIM_IMAGES: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.122.0

      - name: Start minimal local Supabase
        id: supabase
        run: >-
          supabase start
          -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
          > /dev/null
        background: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 12.14.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Wait for minimal local Supabase
        wait: supabase

      - name: Run integration tests
        run: pnpm test:integration

  production-ci-gate:
    name: Production CI gate
    needs: [checks, integration]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require both CI jobs to pass
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        run: |
          echo "checks=$CHECKS_RESULT integration=$INTEGRATION_RESULT"
          test "$CHECKS_RESULT" = success && test "$INTEGRATION_RESULT" = success
